# ============================================================
# SoulChill — LiveKit مُستضاف ذاتياً لـ wss://live.chat-arab.me:8443
# مأخوذ ومحوّر من config-sample.yaml الرسمي (livekit/livekit v1.13.x)
# ============================================================

# منفذ الإشارات (Signaling) و Room Service — يبقى خلف nginx/Caddy
# ولا يُكشف للإنترنت مباشرة (في docker-compose يُربط على127.0.0.1 فقط)
port: 7880

# إعدادات WebRTC
rtc:
  # منافذ وسائط الصوت/الفيديو (UDP) — يجب فتحها في الجدار الناري
  # ومجموعة أمان السحابة: وإلا لا صوت ولا صورة!
  port_range_start: 50000
  port_range_end: 60000

  # احتياط ICE فوق TCP لمن يحجب UDP (يُنشر مباشرة — لا يمر خلف الـ proxy)
  tcp_port: 7881

  # اكتشاف IP العام تلقائياً (ضروري داخل Docker/NAT/SNAT)
  use_external_ip: true
  # في حال اكتشاف LiveKit عنواناً خاطئاً (شبكة خاصة/سحابة خاصة) ضع IP العام يدوياً:
  # node_ip: x.x.x.x

# مفاتيح API — يجب أن تطابق حرفياً ما في لوحة الإدارة
# (الإدارة ← تبويب LiveKit ← 🎲 توليد ← حفظ ← انسخ من نافذة Generated API key)
keys:
  REPLACE_WITH_API_KEY: REPLACE_WITH_API_SECRET
