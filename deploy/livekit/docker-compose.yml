# LiveKit لـ live.chat-arab.me — يُشغَّل بـ:
#   docker compose up -d
services:
  livekit:
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    command: ["--config", "/etc/livekit/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      # الإشارات للـ proxy المحلي فقط (nginx/Caddy على host)
      - "127.0.0.1:7880:7880"
      # احتياط ICE/TCP (يفتح مباشرة للإنترنت)
      - "7881:7881/tcp"
      # وسائط الصوت/الفيديو — حتماً فتحها بالجدار الناري ومجموعة أمان السحابة
      - "50000-60000:50000-60000/udp"
