# LiveKit WSS على live.chat-arab.me:8443
# ضعه في: /etc/nginx/conf.d/live.chat-arab.me.conf   ثم: nginx -t && systemctl reload nginx
# الشهادة: certbot --nginx -d live.chat-arab.me

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl;
    server_name live.chat-arab.me;

    ssl_certificate     /etc/letsencrypt/live/live.chat-arab.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.chat-arab.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # LiveKit يستخدم WebSocket (/rtc) ثم HTTP للـ JOIN — نمرر الكل كما هو
    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
