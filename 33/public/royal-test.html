<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدخول الملكي خلف chatScreen</title>
<link rel="stylesheet" href="/icons/framework7-icons.css">
<link rel="stylesheet" href="/css/style.css">
<style>
body { margin:0; background:#0e1220; display:flex; justify-content:center; min-height:100vh; }
#frame { width:100%; max-width:430px; background:#f7f8fc; position:relative; overflow:hidden; min-height:100vh; display:flex; flex-direction:column; }
.test-head { background:#fff; padding:14px; border-bottom:1px solid #e5e7f0; text-align:center; position:relative; z-index:10; }
.test-head h2 { font-size:17px; font-weight:900; color:#7c4a03; margin:0 0 6px; }
.test-head p { font-size:11px; color:#8a5a0a; margin:0; line-height:1.6; }
#chatScreen { flex:1; display:flex; flex-direction:column; position:relative; z-index:2; overflow:hidden; background:var(--bg); background-image:radial-gradient(#e0e3ef 1px, transparent 1px); background-size:9px 9px; min-height:0; transition:background .6s ease; }
#chatScreen.royal-active { background:rgba(247,248,252,.35) !important; background-image:none !important; }
.c-top { direction:ltr; display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid #e5e7f0; flex:none; background:#fff; position:relative; z-index:5; }
.c-room-name { font-weight:800; font-size:13px; color:#2c3154; background:#eef0f6; border-radius:20px; padding:7px 14px; }
.c-notice { direction:ltr; display:flex; align-items:center; gap:8px; padding:6px 10px; background:#e2e8f0 !important; flex:none; position:relative; z-index:5; }
.lb-text { flex:1; color:#9c1e46; font-weight:900; font-size:11px; }
#msgArea { flex:1; overflow-y:auto; padding:8px 10px; position:relative; z-index:3; background:#e2e8f0 !important; min-height:260px; transition:background .6s ease; }
#msgArea .msg { margin-bottom:8px; display:flex; gap:6px; align-items:flex-end; position:relative; z-index:4; }
#msgArea .mava { width:36px; height:36px; border-radius:50%; overflow:hidden; flex:none; background:#fff; }
#msgArea .mava img { width:100%; height:100%; object-fit:cover; }
#msgArea .mbody { background:#fff; padding:6px 10px; border-radius:12px; font-size:13px; font-weight:700; max-width:75%; box-shadow:0 1px 3px rgba(0,0,0,.08); }
#chatScreen.royal-active #msgArea { background:rgba(226,232,240,.32) !important; }
#chatScreen.royal-active .c-top { background:rgba(255,255,255,.82) !important; backdrop-filter:blur(6px); }
#chatScreen.royal-active .c-notice { background:rgba(226,232,240,.55) !important; }
#chatScreen.royal-active .c-input { background:rgba(255,255,255,.78) !important; backdrop-filter:blur(6px); }
.chat-bg-watermark { position:absolute; top:52%; left:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:1; opacity:.22; }
.pm-water { font-size:28px; font-weight:900; color:#94a3b8; }
.c-input { direction:ltr; display:flex; align-items:center; gap:6px; padding:6px; border-top:1px solid #e5e7f0; flex:none; background:#fff; position:relative; z-index:5; }
.ci-field { flex:1; border:1px solid #c8c8cd; border-radius:20px; padding:8px 12px; font-size:13px; }
.test-body { flex:none; padding:10px; background:#fff; border-top:1px solid #e5e7f0; position:relative; z-index:10; }
.test-btn { width:100%; padding:12px; border:0; border-radius:12px; font-size:13px; font-weight:900; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
.test-btn:active { transform:scale(.97); }
.btn-lion { background:linear-gradient(100deg,#b97a12,#f4b942 50%,#b97a12); color:#4a2f02; border:2px solid rgba(255,232,170,.9); }
.btn-whale { background:linear-gradient(100deg,#0ea5e9,#38bdf8); color:#fff; }
.btn-eagle { background:linear-gradient(100deg,#7c3aed,#a78bfa); color:#fff; }
.btn-unicorn { background:linear-gradient(100deg,#ec4899,#f472b6); color:#fff; }
.btn-girl { background:linear-gradient(100deg,#ec4899,#f59e0b); color:#fff; }
.ref-row { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
.ref-row img { width:100%; height:80px; object-fit:cover; border-radius:10px; border:1px solid #fde68a; }
/* الطبقة خلف chatScreen */
#frame .royal-entry-layer.behind-chat { position:absolute; inset:0; z-index:1; overflow:hidden; pointer-events:none; }
</style>
</head>
<body>
<div id="frame">
  <div class="test-head">
    <h2>🦁 الدخول الملكي خلف chatScreen</h2>
    <p>التأثير الآن <b>خلف</b> <code>#chatScreen</code> بالكامل<br>يظهر من الأسفل بكامل الصفحة ومنتصف الارتفاع مثل تيك توك</p>
  </div>
  
  <!-- خلف chatScreen -->
  <div class="royal-entry-layer behind-chat" id="royalEntryLayer" aria-hidden="true"></div>

  <section id="chatScreen" class="screen active">
    <header class="c-top">
      <span class="c-room-name">👑 الغرفة الملكية</span>
    </header>
    <div class="c-notice"><span class="lb-text">الدخول الملكي خلف chatScreen بالكامل</span></div>
    <div class="chat-bg-watermark"><div class="pm-water">نجوم العرب</div></div>
    
    <div class="c-msgs" id="msgArea">
      <div class="msg"><div class="mava"><img src="/avatars/def/01.jpg"></div><div class="mbody"><div class="mname">ax 👑</div><div class="mtext">أهلاً بالملوك 👑</div></div></div>
      <div class="msg"><div class="mava"><img src="/avatars/def/05.jpg"></div><div class="mbody"><div class="mname">محمد الاردن</div><div class="mtext">الأسد قادم من الأسفل 🦁</div></div></div>
      <div class="msg"><div class="mava"><img src="/avatars/nature/03.jpg"></div><div class="mbody"><div class="mname">سارة</div><div class="mtext">مثل تيك توك تماماً - من الأسفل وبكامل الصفحة!</div></div></div>
    </div>
    
    <div class="c-input"><textarea class="ci-field" placeholder="رسالة عامة"></textarea></div>
  </section>

  <div class="test-body">
    <div style="display:flex;flex-direction:column;gap:6px">
      <button class="test-btn btn-lion" onclick="showRoyal('lion','boy')">🦁 الأسد من الأسفل - بكامل صفحة chatScreen</button>
      <button class="test-btn btn-girl" onclick="showRoyal('lion','girl')">🦁💖 الأسد بنت - تيك توك خلف chatScreen</button>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <button class="test-btn btn-whale" onclick="showRoyal('whale','boy')">🐋 حوت - whale.gif</button>
        <button class="test-btn btn-unicorn" onclick="showRoyal('unicorn','girl')">🦄 وحيد - unicorn.gif</button>
      </div>
      <button class="test-btn btn-eagle" onclick="showRoyal('eagle','boy')">🦅 عقاب - flying-eagle-eagle.gif</button>
      <div class="ref-row">
        <img src="/img/royal_lion_gif.gif" alt="lion"><img src="/img/royal_whale.gif" alt="whale">
        <img src="/img/royal_unicorn.gif" alt="unicorn"><img src="/img/royal_eagle.gif" alt="eagle">
      </div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
function esc(s){ return String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const ROYAL_ANIMALS = [
  { key: 'lion', name: 'الأسد الملكي', emoji: '🦁', color: '#f59e0b', gif: '/img/royal_lion_gif.gif' },
  { key: 'whale', name: 'الحوت الملكي', emoji: '🐋', color: '#38bdf8', gif: '/img/royal_whale.gif' },
  { key: 'eagle', name: 'العقاب الملكي', emoji: '🦅', color: '#a78bfa', gif: '/img/royal_eagle.gif' },
  { key: 'unicorn', name: 'الوحيد قرن', emoji: '🦄', color: '#f472b6', gif: '/img/royal_unicorn.gif' }
];
function royalAnimal(k){ return ROYAL_ANIMALS.find(a=>a.key===k)||ROYAL_ANIMALS[0]; }
let ROYAL_ENTRY_TIMER=null;
function triggerRoyalEntry(username, avatar, animal, gender){
  const layer=$('#royalEntryLayer'); const chatScreen=$('#chatScreen');
  if(!layer) return; clearTimeout(ROYAL_ENTRY_TIMER); layer.innerHTML='';
  const a=royalAnimal(animal||'lion'); const isGirl=gender==='girl';
  layer.classList.toggle('royal-girl', isGirl);
  if(chatScreen) chatScreen.classList.add('royal-active');

  const bg=document.createElement('div'); bg.className='rt-tiktok-bg'; layer.appendChild(bg);
  const rays=document.createElement('div'); rays.className='rt-rays'; layer.appendChild(rays);
  const mist=document.createElement('div'); mist.className='rt-gold-mist'; layer.appendChild(mist);

  const coins=document.createElement('div'); coins.className='rt-coins-layer';
  for(let i=0;i<20;i++){ const c=document.createElement('i'); c.className='rt-coin'; c.textContent=['🪙','✨','💰','🌟'][Math.floor(Math.random()*4)]; c.style.setProperty('--x',Math.random()*100+'%'); c.style.setProperty('--dx',Math.random()*100-50+'px'); c.style.setProperty('--sz',11+Math.random()*14+'px'); c.style.setProperty('--delay',Math.random()*2.8+'s'); c.style.setProperty('--dur',2+Math.random()*1.8+'s'); coins.appendChild(c); }
  layer.appendChild(coins);

  const stage=document.createElement('div'); stage.className='rt-lion-stage';
  const lion=document.createElement('div'); lion.className='rt-lion rt-lion-'+a.key; lion.style.setProperty('--rc',a.color);
  let avaHtml = avatar && avatar.startsWith('/') ? `<img src="${esc(avatar)}">` : `<span>👑</span>`;
  const gifSrc=a.gif||''; const gifVisual = gifSrc ? `<img class="rt-main-gif" src="${esc(gifSrc)}" alt="${esc(a.name)}"><span class="rt-lion-emoji" style="display:none">${a.emoji}</span>` : `<span class="rt-lion-emoji">${a.emoji}</span>`;
  lion.innerHTML=`<div class="rt-gif-wrap">${gifVisual}<span class="rt-lion-roar-ring"></span><span class="rt-lion-roar-ring r2"></span></div>`;
  stage.appendChild(lion); layer.appendChild(stage);

  const banner=document.createElement('div'); banner.className='rt-banner-tiktok';
  banner.innerHTML=`<span class="rt-banner-ava">${avaHtml}</span><div class="rt-banner-info"><b>${esc(username)}</b><span>👑 دخول ملكي • ${esc(a.name)} ${a.emoji}</span></div><span class="rt-banner-lion">${a.emoji}</span>`;
  layer.appendChild(banner);

  const sparks=document.createElement('div'); sparks.className='rt-sparks';
  for(let s=0;s<22;s++){ const sp=document.createElement('i'); sp.className='rt-spark'+(isGirl&&s%4===0?' heart-spark':''); sp.style.setProperty('--sx',20+Math.random()*60+'%'); sp.style.setProperty('--sy',30+Math.random()*50+'%'); sp.style.setProperty('--dx',Math.random()*200-100+'px'); sp.style.setProperty('--dy',-(40+Math.random()*180)+'px'); sp.style.setProperty('--sz',4+Math.random()*8+'px'); sp.style.setProperty('--delay',0.2+Math.random()*2.2+'s'); sp.style.setProperty('--dur',1+Math.random()*1.2+'s'); sparks.appendChild(sp); }
  layer.appendChild(sparks);

  ROYAL_ENTRY_TIMER=setTimeout(()=>{ layer.style.transition='opacity .6s ease'; layer.style.opacity='0'; setTimeout(()=>{ layer.innerHTML=''; layer.style.opacity=''; layer.classList.remove('royal-girl'); if(chatScreen) chatScreen.classList.remove('royal-active'); },600); },5800);
}
function showRoyal(animal, gender){
  const names=['ax','محمد الاردن','الملك','سارة','اسد العرب'];
  const name=names[Math.floor(Math.random()*names.length)];
  const avs=['/avatars/def/01.jpg','/avatars/def/05.jpg','/avatars/nature/03.jpg'];
  const av=avs[Math.floor(Math.random()*avs.length)];
  triggerRoyalEntry(name, av, animal, gender);
}
</script>
</body>
</html>
