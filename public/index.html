<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SoulChill - عالم الأرواح والدردشة الصوتية | سول شل</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/stream.css">
  <link rel="stylesheet" href="css/room-pro.css">
  <link rel="stylesheet" href="css/room-video.css">
  <link rel="stylesheet" href="css/room-user-sheet.css">
  <link rel="stylesheet" href="css/dm-new.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪐</text></svg>">
  <!-- Official Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- Main Viewport Wrapper -->
  <div class="app-viewport">
    <div class="app-container tab-planet-active" id="main-app-container">

      <!-- Simulated Mobile Phone Status Bar -->
      <div class="phone-status-bar">
        <span>9:41</span>
        <div class="status-bar-notch"></div>
        <div style="display: flex; gap: 6px; align-items: center;">
          <span>5G</span>
          <span>100% 🔋</span>
        </div>
      </div>

      <!-- App Top Header (Shown on secondary tabs; Planet tab uses its own authentic SoulChill header) -->
      <header class="app-top-header" id="main-app-top-header">
        <!-- شريط تبويب «المنشورات» الثابت (يظهر فقط عند فتح المنشورات) -->
        <div class="moments-top-bar" id="moments-top-bar">
          <div class="moments-top-tabs">
            <button type="button" class="mtb-tab active" data-scope="all" id="moments-tab-all">المنشورات</button>
            <button type="button" class="mtb-tab" data-scope="friends" id="moments-tab-friends">الأصدقاء</button>
          </div>
          <button type="button" class="mtb-plus" id="moments-top-add-btn" title="نشر منشور" aria-label="نشر منشور">+</button>
        </div>

        <!-- شريط تبويب «حفلة» الثابت (يظهر فقط عند فتح تبويب الحفلة) -->
        <div class="rooms-top-bar" id="rooms-top-bar">
          <div class="rooms-top-title">حفلة</div>
          <div class="rooms-top-actions">
            <button type="button" class="rtb-btn" id="rooms-top-search-btn" title="بحث" aria-label="بحث">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
            </button>
            <button type="button" class="rtb-btn rtb-flag" id="rooms-top-interests-btn" title="مركز اهتماماتي" aria-label="مركز اهتماماتي">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 3.5a1 1 0 011 1V5h11.2a1 1 0 01.8 1.6L17.2 10l1.8 3.4a1 1 0 01-.9 1.5H7v5.1a1 1 0 11-2 0V4.5a1 1 0 011-1z"/></svg>
            </button>
            <button type="button" class="rtb-btn rtb-create" id="rooms-top-create-btn" title="إنشاء غرفة صوتية" aria-label="إنشاء غرفة صوتية">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 2.8L3.6 9.6a1.9 1.9 0 00-.6 1.9l1.5 7.8a2 2 0 002 1.6h8.2a5.4 5.4 0 01-.2-1.4 5.5 5.5 0 015.5-5.5c.5 0 .9.1 1.3.2l-.3-1.6a1.9 1.9 0 00-.6-1.1L12 2.8zM18.5 15a.9.9 0 00-.9.9v1.6h-1.6a.9.9 0 100 1.8h1.6v1.6a.9.9 0 101.8 0v-1.6H21a.9.9 0 100-1.8h-1.6v-1.6a.9.9 0 00-.9-.9z"/></svg>
            </button>
            <button class="notif-bell-btn rtb-btn rtb-bell" type="button" title="الإشعارات" aria-label="الإشعارات">🔔<span class="notif-bell-badge" style="display:none;">0</span></button>
          </div>
        </div>

        <div class="brand-wrapper">
          <div class="brand-logo-icon">🪐</div>
          <div>
            <div class="brand-text-title">SoulChill</div>
            <div class="brand-text-sub">سول شل • عالم الأرواح</div>
          </div>
        </div>

        <div class="header-user-status">
          <!-- Currency Badges -->
          <div class="currency-badge coins" id="header-coins-badge" title="عملات سول">
            <span>🪙</span>
            <span id="header-coins-val">2,000</span>
          </div>
          <div class="currency-badge diamonds" id="header-diamonds-badge" title="ألماس ملكي">
            <span>💎</span>
            <span id="header-diamonds-val">500</span>
          </div>

          <!-- Notifications bell -->
          <button class="notif-bell-btn header-action-btn" id="header-notif-bell-btn" type="button" title="الإشعارات">🔔<span class="notif-bell-badge" style="display:none;">0</span></button>

          <!-- Mode switcher (Phone / Fullscreen) -->
          <button class="header-action-btn" id="header-mode-toggle-btn" title="تبديل حجم الشاشة">💻</button>

          <!-- Language toggle -->
          <button class="header-action-btn" id="header-lang-toggle-btn" title="تغيير اللغة" style="font-size: 11px; font-weight: 800;">EN</button>

          <!-- Admin Panel Button (Strictly for owner, super_master, super_admin) -->
          <a href="/admin" class="header-action-btn admin-link-btn" id="header-admin-link-btn" title="لوحة تحكم وإدارة الدردشة" target="_blank" style="display: none; background: rgba(245, 158, 11, 0.18); border: 1.5px solid #fbbf24; color: #fbbf24; text-decoration: none; align-items: center; justify-content: center; font-size: 13px;">🛡️</a>

          <!-- User Avatar -->
          <div class="header-user-avatar-btn" id="header-user-avatar-btn" title="الملف الشخصي">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" id="header-user-avatar" alt="Avatar" />
          </div>
        </div>
      </header>

      <!-- Daily Bonus Quick Bar -->
      <div class="daily-banner-strip" id="main-daily-banner-strip">
        <div class="bonus-text">
          <span>🎁</span>
          <span id="daily-bonus-text">سجل حضورك اليومي واحصل على <strong>+500 عملة مجاناً!</strong></span>
        </div>
        <button id="header-daily-checkin-btn">استلام المكافأة ⚡</button>
      </div>

      <!-- Main Dynamic Content Container (Where tabs render) -->
      <main class="app-content" id="app-main-content">
        <!-- Tab content injected here via app.js -->
      </main>

      <!-- App Bottom Navigation Bar (5 iconic SoulChill tabs matching the GIF) -->
      <nav class="app-bottom-nav">
        <!-- Tab 1 (Rightmost in RTL): الكوكب -->
        <button class="nav-tab-item active" data-tab="planet">
          <span class="tab-icon planet-orb-nav-icon">
            <svg viewBox="0 0 36 36" width="26" height="26">
              <defs>
                <radialGradient id="navPlanetGrad" cx="35%" cy="30%" r="70%">
                  <stop offset="0%" stop-color="#f5d0fe" />
                  <stop offset="40%" stop-color="#a855f7" />
                  <stop offset="75%" stop-color="#6366f1" />
                  <stop offset="100%" stop-color="#31105a" />
                </radialGradient>
                <linearGradient id="navPlanetRing" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#e879f9" stop-opacity="0.9" />
                  <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5" />
                  <stop offset="100%" stop-color="#c084fc" stop-opacity="0.85" />
                </linearGradient>
              </defs>
              <circle cx="18" cy="18" r="12" fill="url(#navPlanetGrad)" />
              <ellipse cx="18" cy="18" rx="16.5" ry="5.2" fill="none" stroke="url(#navPlanetRing)" stroke-width="2" transform="rotate(-22 18 18)" />
              <circle cx="14" cy="13.5" r="2.2" fill="#ffffff" opacity="0.55" />
            </svg>
          </span>
          <span class="tab-label">الكوكب</span>
        </button>

        <!-- Tab 2: حفلة -->
        <button class="nav-tab-item" data-tab="rooms">
          <span class="tab-icon">
            <svg viewBox="0 0 28 28" width="24" height="24" fill="currentColor">
              <path d="M14 3.2L4.2 11.2a2.2 2.2 0 00-.7 2.2l1.8 9.2a2.4 2.4 0 002.35 1.9h12.7a2.4 2.4 0 002.35-1.9l1.8-9.2a2.2 2.2 0 00-.7-2.2L14 3.2zm-3.6 13.3a1 1 0 011.4-.15c1.25 1.05 3.15 1.05 4.4 0a1 1 0 111.3 1.52c-2.02 1.7-4.98 1.7-7 0a1 1 0 01-.1-1.37z" />
            </svg>
          </span>
          <span class="tab-label">حفلة</span>
        </button>

        <!-- Tab 3 (Center): المنشورات -->
        <button class="nav-tab-item" data-tab="moments">
          <span class="tab-icon">
            <svg viewBox="0 0 28 28" width="24" height="24" fill="currentColor">
              <path d="M14 2.5l3.1 4.2 5.1-.6-2 4.8 3.6 3.7-4.8 1.9.5 5.1-4.3-3-3.2 4.1-1.9-4.8-5.1.5 3-4.3-4.1-3.1 4.8-2-.5-5.1 4.3 3L14 2.5zm-2.8 13.8a.95.95 0 011.34-.1c.9.75 2.22.75 3.12 0a.95.95 0 111.22 1.45c-1.62 1.35-3.94 1.35-5.56 0a.95.95 0 01-.12-1.35z" />
            </svg>
          </span>
          <span class="tab-label">المنشورات</span>
        </button>

        <!-- Tab 4: رسائل -->
        <button class="nav-tab-item" data-tab="chat">
          <span class="tab-icon">
            <svg viewBox="0 0 28 28" width="24" height="24" fill="currentColor">
              <path d="M6.5 4.5h15A3.5 3.5 0 0125 8v9.5a3.5 3.5 0 01-3.5 3.5H16l-4.2 3.3a1 1 0 01-1.6-.8V21H6.5A3.5 3.5 0 013 17.5V8a3.5 3.5 0 013.5-3.5zm3.9 9.7a1 1 0 011.4-.15c1.25 1.05 3.15 1.05 4.4 0a1 1 0 111.3 1.52c-2.02 1.7-4.98 1.7-7 0a1 1 0 01-.1-1.37z" />
            </svg>
          </span>
          <span class="tab-label">رسائل</span>
          <span class="unread-badge" id="nav-chat-unread-badge" style="display: none;">0</span>
        </button>

        <!-- Tab 5 (Leftmost in RTL): انا -->
        <button class="nav-tab-item" data-tab="profile">
          <span class="tab-icon" style="position: relative;">
            <span class="profile-nav-red-dot"></span>
            <svg viewBox="0 0 28 28" width="24" height="24" fill="currentColor">
              <circle cx="14" cy="9.5" r="5" />
              <path d="M5.5 22.5c0-4.2 3.8-7.2 8.5-7.2s8.5 3 8.5 7.2a1.5 1.5 0 01-1.5 1.5H7a1.5 1.5 0 01-1.5-1.5zm6-3.7a.9.9 0 00-.2 1.26c1.58 1.32 3.82 1.32 5.4 0a.9.9 0 10-1.15-1.38c-.9.75-2.2.75-3.1 0a.9.9 0 00-.95.12z" />
            </svg>
          </span>
          <span class="tab-label">أنت</span>
        </button>
      </nav>

    </div>
  </div>

  <!-- Socket.IO & App Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/radar.js"></script>
  <script src="js/gifts-effects.js"></script>
  <script src="js/frames.js"></script>
  <script src="js/voice-rings.js"></script>
  <script src="js/webrtc.js"></script>
  <script src="js/app.js"></script>
  <script src="js/room-pro.js"></script>
  <script src="js/room-video.js"></script>
  <script src="js/dm-new.js"></script>
</body>
</html>
