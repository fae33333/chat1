<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - شات نجوم العرب</title>
<link rel="stylesheet" href="/icons/framework7-icons.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<!-- شاشة تسجيل دخول المشرف -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo"><i class="f7-icons">shield_fill</i></div>
    <h2>لوحة التحكم</h2>
    <p class="login-sub">شات نجوم العرب</p>
    <div class="login-field">
      <i class="f7-icons">person_fill</i>
      <input type="text" id="loginUser" placeholder="اسم المستخدم" autocomplete="username">
    </div>
    <div class="login-field">
      <i class="f7-icons">lock_fill</i>
      <input type="password" id="loginPass" placeholder="كلمة المرور" autocomplete="current-password">
    </div>
    <button class="btn-grad-purple btn-block" id="loginBtn"><i class="f7-icons">arrow_right_to_line</i> دخول</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- هيكل اللوحة -->
<div id="panel" style="display:none">
  <!-- الشريط الجانبي (يسار) -->
  <aside class="sidebar">
    <div class="sb-header">
      <i class="f7-icons">shield_fill</i>
      <span>لوحة التحكم</span>
    </div>
    <div class="sb-user">
      <div class="sb-user-name"><i class="f7-icons">person_crop_circle_fill</i> <span id="sbUserName">-</span></div>
      <div class="sb-user-rank"><span class="star">★</span> الصلاحية : <b id="sbUserRank">-</b></div>
    </div>
    <nav class="sb-menu" id="sbMenu"></nav>
    <button class="sb-logout" id="logoutBtn"><i class="f7-icons">power</i> تسجيل الخروج</button>
  </aside>

  <!-- المحتوى -->
  <main class="content" id="content"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<script src="/js/admin.js"></script>
</body>
</html>
