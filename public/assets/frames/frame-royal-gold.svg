<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="rg-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdea"/>
      <stop offset="22%" stop-color="#ffe87a"/>
      <stop offset="48%" stop-color="#f6bc2b"/>
      <stop offset="74%" stop-color="#d99a12"/>
      <stop offset="100%" stop-color="#8f5c05"/>
    </linearGradient>
    <linearGradient id="rg-gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6c2"/>
      <stop offset="45%" stop-color="#f7c33c"/>
      <stop offset="100%" stop-color="#b9770a"/>
    </linearGradient>
    <radialGradient id="rg-pink" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#ffe6f5"/>
      <stop offset="42%" stop-color="#ff6fc4"/>
      <stop offset="100%" stop-color="#bd1a78"/>
    </radialGradient>
    <radialGradient id="rg-blue" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#e6f3ff"/>
      <stop offset="45%" stop-color="#5aa6ff"/>
      <stop offset="100%" stop-color="#173fd6"/>
    </radialGradient>
    <filter id="rg-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- golden aura -->
  <circle cx="60" cy="60" r="46" stroke="#ffd24d" stroke-width="9" opacity="0.30" filter="url(#rg-soft)"/>

  <!-- outer petal crown (12 petals) -->
  <g fill="url(#rg-gold2)" stroke="#8a5a06" stroke-width="0.75">
    <g id="rg-petal">
      <path d="M60 3.4 C 66.6 10.6 68 20.2 60 27.4 C 52 20.2 53.4 10.6 60 3.4 Z"/>
      <path d="M60 9 C 63 13 63.6 18 60 21.6 C 56.4 18 57 13 60 9 Z" fill="#fff8d8" stroke="none" opacity="0.85"/>
    </g>
    <use href="#rg-petal" transform="rotate(0 60 60)"/>
    <use href="#rg-petal" transform="rotate(30 60 60)"/>
    <use href="#rg-petal" transform="rotate(60 60 60)"/>
    <use href="#rg-petal" transform="rotate(90 60 60)"/>
    <use href="#rg-petal" transform="rotate(120 60 60)"/>
    <use href="#rg-petal" transform="rotate(150 60 60)"/>
    <use href="#rg-petal" transform="rotate(180 60 60)"/>
    <use href="#rg-petal" transform="rotate(210 60 60)"/>
    <use href="#rg-petal" transform="rotate(240 60 60)"/>
    <use href="#rg-petal" transform="rotate(270 60 60)"/>
    <use href="#rg-petal" transform="rotate(300 60 60)"/>
    <use href="#rg-petal" transform="rotate(330 60 60)"/>
  </g>

  <!-- pearls + gems on the outer hoop -->
  <g>
    <circle cx="60" cy="14.5" r="2.35" fill="#fffdf2" stroke="#d8a326" stroke-width="0.55" transform="rotate(0 60 60)"/>
    <circle cx="60" cy="14.5" r="2.35" fill="#fffdf2" stroke="#d8a326" stroke-width="0.55" transform="rotate(30 60 60)"/>
    <circle cx="60" cy="14.5" r="2.35" fill="#fffdf2" stroke="#d8a326" stroke-width="0.55" transform="rotate(60 60 60)"/>
    <circle cx="60" cy="14.5" r="2.35" fill="#fffdf2" stroke="#d8a326" stroke-width="0.55" transform="rotate(90 60 60)"/>
    <circle cx="60" cy="14.5" r="2.35" fill="#fffdf2" stroke="#d8a326" stroke-width="0.55" transform="rotate(120 60 60)"/>
    <circle cx="60" cy="14.5" r="2.35" fill="#fffdf2" stroke="#d8a326" stroke-width="0.55" transform="rotate(150 60 60)"/>
    <circle cx="60" cy="14.5" r="2.35" fill="#fffdf2" stroke="#d8a326" stroke-width="0.55" transform="rotate(180 60 60)"/>
    <circle cx="60" cy="14.5" r="2.35" fill="#fffdf2" stroke="#d8a326" stroke-width="0.55" transform="rotate(210 60 60)"/>
    <circle cx="60" cy="14.5" r="2.35" fill="#fffdf2" stroke="#d8a326" stroke-width="0.55" transform="rotate(240 60 60)"/>
    <circle cx="60" cy="14.5" r="2.35" fill="#fffdf2" stroke="#d8a326" stroke-width="0.55" transform="rotate(270 60 60)"/>
    <circle cx="60" cy="14.5" r="2.35" fill="#fffdf2" stroke="#d8a326" stroke-width="0.55" transform="rotate(300 60 60)"/>
    <circle cx="60" cy="14.5" r="2.35" fill="#fffdf2" stroke="#d8a326" stroke-width="0.55" transform="rotate(330 60 60)"/>
  </g>
  <g>
    <circle cx="60" cy="22.5" r="1.55" fill="url(#rg-pink)" stroke="#8d1a63" stroke-width="0.4" transform="rotate(22.5 60 60)"/>
    <circle cx="60" cy="22.5" r="1.55" fill="url(#rg-pink)" stroke="#8d1a63" stroke-width="0.4" transform="rotate(67.5 60 60)"/>
    <circle cx="60" cy="22.5" r="1.55" fill="url(#rg-pink)" stroke="#8d1a63" stroke-width="0.4" transform="rotate(112.5 60 60)"/>
    <circle cx="60" cy="22.5" r="1.55" fill="url(#rg-pink)" stroke="#8d1a63" stroke-width="0.4" transform="rotate(157.5 60 60)"/>
    <circle cx="60" cy="22.5" r="1.55" fill="url(#rg-pink)" stroke="#8d1a63" stroke-width="0.4" transform="rotate(202.5 60 60)"/>
    <circle cx="60" cy="22.5" r="1.55" fill="url(#rg-pink)" stroke="#8d1a63" stroke-width="0.4" transform="rotate(247.5 60 60)"/>
    <circle cx="60" cy="22.5" r="1.55" fill="url(#rg-pink)" stroke="#8d1a63" stroke-width="0.4" transform="rotate(292.5 60 60)"/>
    <circle cx="60" cy="22.5" r="1.55" fill="url(#rg-pink)" stroke="#8d1a63" stroke-width="0.4" transform="rotate(337.5 60 60)"/>
  </g>
  <g>
    <path d="M 60.00,8.60 L 60.81,11.19 L 63.40,12.00 L 60.81,12.81 L 60.00,15.40 L 59.19,12.81 L 56.60,12.00 L 59.19,11.19 Z" fill="#fffbe8" opacity="0.95" transform="rotate(45 60 60)"/>
    <path d="M 60.00,8.60 L 60.81,11.19 L 63.40,12.00 L 60.81,12.81 L 60.00,15.40 L 59.19,12.81 L 56.60,12.00 L 59.19,11.19 Z" fill="#fffbe8" opacity="0.95" transform="rotate(135 60 60)"/>
    <path d="M 60.00,8.60 L 60.81,11.19 L 63.40,12.00 L 60.81,12.81 L 60.00,15.40 L 59.19,12.81 L 56.60,12.00 L 59.19,11.19 Z" fill="#fffbe8" opacity="0.95" transform="rotate(225 60 60)"/>
    <path d="M 60.00,8.60 L 60.81,11.19 L 63.40,12.00 L 60.81,12.81 L 60.00,15.40 L 59.19,12.81 L 56.60,12.00 L 59.19,11.19 Z" fill="#fffbe8" opacity="0.95" transform="rotate(315 60 60)"/>
  </g>

  <!-- main golden band -->
  <circle cx="60" cy="60" r="42.6" stroke="#8a5a06" stroke-width="9.4" opacity="0.9"/>
  <circle cx="60" cy="60" r="42.6" stroke="url(#rg-gold)" stroke-width="7.6"/>
  <circle cx="60" cy="60" r="46.6" stroke="#fff7cd" stroke-width="1.15" opacity="0.95"/>
  <circle cx="60" cy="60" r="38.4" stroke="#ffe9a1" stroke-width="1.05" opacity="0.9"/>

  <!-- side flourishes -->
  <path d="M6 60 C 14 52 20 54 24 58 C 20 62 14 68 6 60 Z" fill="url(#rg-gold2)" stroke="#8a5a06" stroke-width="0.7"/>
  <path d="M114 60 C 106 52 100 54 96 58 C 100 62 106 68 114 60 Z" fill="url(#rg-gold2)" stroke="#8a5a06" stroke-width="0.7"/>

  <!-- crown crest -->
  <g transform="translate(60 15)">
    <path d="M -13 4 L -8 -6 L -4 1 L 0 -9 L 4 1 L 8 -6 L 13 4 Z" fill="url(#rg-gold2)" stroke="#7d4f04" stroke-width="0.85"/>
    <circle cx="0" cy="-10.6" r="1.9" fill="url(#rg-pink)" stroke="#8d1a63" stroke-width="0.4"/>
    <circle cx="-8.4" cy="-7.2" r="1.35" fill="url(#rg-blue)" stroke="#1a3fb0" stroke-width="0.4"/>
    <circle cx="8.4" cy="-7.2" r="1.35" fill="url(#rg-blue)" stroke="#1a3fb0" stroke-width="0.4"/>
    <rect x="-13" y="4" width="26" height="2.6" rx="1.3" fill="#b9770a"/>
  </g>

  <!-- pink gem trio at the bottom -->
  <g filter="url(#rg-soft)">
    <path d="M60 79.5 C 65.4 84.6 65.4 90.6 60 93.6 C 54.6 90.6 54.6 84.6 60 79.5 Z" fill="url(#rg-pink)" stroke="#8d1a63" stroke-width="0.75"/>
    <path d="M46.5 76.5 C 50.6 80.4 50.6 84.9 46.5 87.1 C 42.4 84.9 42.4 80.4 46.5 76.5 Z" fill="url(#rg-pink)" stroke="#8d1a63" stroke-width="0.6" opacity="0.95"/>
    <path d="M73.5 76.5 C 77.6 80.4 77.6 84.9 73.5 87.1 C 69.4 84.9 69.4 80.4 73.5 76.5 Z" fill="url(#rg-pink)" stroke="#8d1a63" stroke-width="0.6" opacity="0.95"/>
  </g>

  <!-- blue star medallion -->
  <g transform="translate(95 91)">
    <circle cx="0" cy="0" r="12.6" fill="#12224f" opacity="0.9"/>
    <circle cx="0" cy="0" r="12.6" stroke="url(#rg-gold)" stroke-width="2.1" fill="none"/>
    <path d="M 0.00,-8.20 L 2.00,-2.75 L 7.80,-2.53 L 3.23,1.05 L 4.82,6.63 L 0.00,3.40 L -4.82,6.63 L -3.23,1.05 L -7.80,-2.53 L -2.00,-2.75 Z" fill="url(#rg-blue)" stroke="#dff0ff" stroke-width="0.7"/>
    <circle cx="0" cy="0" r="1.7" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
