  .panel{background:#fff;border-radius:14px;border:1px solid #e8ebf4;box-shadow:0 16px 40px rgba(10,15,40,.25);max-width:420px;margin:0 auto;overflow:hidden;}
  .head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid #eef0f7;font-weight:800;font-size:13px;color:#1b2240;}

  .color-grid{display:flex;flex-flow:wrap;justify-content:space-around;overflow-x:hidden;max-height:240px;overflow-y:auto;padding:5px;}
  .csw{width:30px;height:30px;flex:0 0 auto;margin:2px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(20,25,50,.18);cursor:pointer;transition:transform .12s;padding:0;}
  .csw:active{transform:scale(.9);}
  .csw.auto{width:auto;min-width:50px;height:30px;padding:0 9px;border-radius:16px;background:#fff;color:#1b2240;font-size:10.5px;font-weight:900;border-color:#e2e6f2;}
  .csw.sel{outline:3px solid #1479f2;outline-offset:2px;}
  .note{text-align:center;font-size:12px;color:#8b93a3;margin-top:14px;}
