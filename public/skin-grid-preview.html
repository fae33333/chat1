<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معاينة وضع الجلد — كل الألوان والثيمات</title>
<script src="js/skins.js"></script>
<style>
  body{font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:#f4f6fb;margin:0;padding:24px;color:#1b2240;}
  .wrap{max-width:460px;margin:0 auto;}
  .title{font-weight:900;font-size:17px;margin-bottom:6px;}
  .sub{font-size:12.5px;color:#8b93a3;margin-bottom:18px;}
  .panel{background:#fff;border-radius:16px;border:1px solid #e8ebf4;box-shadow:0 16px 40px rgba(10,15,40,.18);margin-bottom:18px;overflow:hidden;}
  .phead{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid #eef0f7;font-weight:800;font-size:13px;color:#1b2240;}
  .pbody{padding:14px;}
  .sec-t{font-weight:900;font-size:13.5px;margin:14px 4px 8px;color:#374151;}
  .sec-t:first-child{margin-top:0;}
  .themes{display:flex;flex-wrap:wrap;gap:12px;}
  .thm{width:92px;text-align:center;cursor:pointer;}
  .thm .sw{width:92px;height:74px;border-radius:15px;border:3px solid #e5e7eb;transition:transform .12s;box-shadow:0 6px 12px rgba(20,25,50,.12);}
  .thm .sw:hover{transform:translateY(-2px);}
  .thm.sel .sw{border:4px solid #4f46e5;box-shadow:0 6px 18px rgba(79,70,229,.25);}
  .thm .lb{font-size:11.5px;font-weight:800;color:#374151;margin-top:6px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:7px;max-height:280px;overflow-y:auto;padding:2px;}
  .dot{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 5px rgba(20,25,50,.22);cursor:pointer;padding:0;transition:transform .12s;}
  .dot:hover{transform:scale(1.12);}
  .dot.sel{outline:3px solid #4f46e5;outline-offset:2px;}
  .dot.auto{width:auto;min-width:60px;height:32px;border-radius:16px;padding:0 9px;font-size:11px;font-weight:900;color:#fff;border-color:#e5e7eb;}
  .live{border:1.5px solid #e6e8f2;border-radius:14px;padding:14px 16px;min-height:130px;transition:background .2s;}
  .chip{display:inline-block;font-size:11px;font-weight:800;padding:5px 10px;border-radius:8px;margin-top:10px;margin-left:6px;}
  .hint{font-size:11.5px;color:#8b93a3;margin-top:10px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">🎨 وضع الجلد — كل الألوان + الثيمات الجميلة</div>
    <div class="sub">اختر ثيماً جاهزاً أو أي لون من اللوحة، مع معاينة حيّة فورية.</div>
    <div class="panel"><div class="pbody" id="THEMES"></div></div>
    <div class="panel"><div class="phead"><span>🌈 كل الألوان (130 لوناً)</span></div><div class="pbody"><div class="grid" id="COLORS"></div></div></div>
    <div class="panel"><div class="phead"><span>🖥️ معاينة حيّة</span></div><div class="pbody"><div class="live" id="LIVE"></div></div></div>
  </div>

<script>
/* حساب توافق: نقرأ الدوال من skins.js إذا حُمّلت، وإلا ننسخ منطق اللوحة محلياً */
(function () {
  function readSkin() {
    // إذا حُمِّلت skins.js بالفعل، استخدمها
    if (window.SkinLib) return;
    // نسخة مضمّنة احتياطية (لا تُستعمل عادة)
    var COLORS = ['#e57373','#ef5350','#f44336','#e53935','#d32f2f','#c62828','#800c03','#ba68c8','#ab47bc','#9c27b0','#8e24aa','#7b1fa2','#6a1b9a','#4a148c','#f8a8b7','#fc93ac','#f57a9b','#ff6991','#f74877','#fa3468','#fa224a','#7986cb','#5c6bc0','#3f51b5','#3949ab','#303f9f','#283593','#1a237e','#4fc3f7','#29b6f6','#03a9f4','#039be5','#0288d1','#0277bd','#01579b','#4db6ac','#26a69a','#009688','#00897b','#00796b','#00695c','#004d40','#aed581','#9ccc65','#8bc34a','#7cb342','#689f38','#558b2f','#33691e','#fff176','#ffee58','#ffeb3b','#fdd835','#fbc02d','#f9a825','#f57f17','#ffb74d','#ffa726','#ff9800','#fb8c00','#f57c00','#ef6c00','#e65100','#ac5022','#9a461c','#8c3f18','#7b3714','#632c11','#4b220d','#38190a','#000000','#131313','#3d3c3c','#4d4b4b','#5b5757','#6c6a6a','#7a7777','#333333','#666666','#ff0000','#0000ff','#6600ff','#336666','#9900ff','#000066','#336600','#ff0066','#663333','#cc6600','#ff6600','#996600','#0066cc','#009966','#ffcc00','#666600','#339900','#ff3366','#993366','#6666ff','#ff9900','#999900','#003399','#9966ff','#cc3399','#ff0099','#663366','#198139','#ff3333','#800080','#6699ff','#666699','#993300','#000033','#669933','#cc99ff','#ff00cc','#cc3366','#339933','#ff66ff','#800000','#663300','#ff00ff','#ff9966','#330099','#cc9900','#993333','#660000','#00cc33','#ff6699','#ff3478'];
    var THEMES = {
      default:{primary:'#9c1e46',secondary:'#c22e5e',label:'عنابي'},
      blue:{primary:'#1d4ed8',secondary:'#3b82f6',label:'أزرق ملكي'},
      green:{primary:'#15803d',secondary:'#22c55e',label:'أخضر زمردي'},
      purple:{primary:'#7c3aed',secondary:'#a855f7',label:'بنفسجي أنيق'},
      black:{primary:'#111827',secondary:'#4b5563',label:'أسود ليلي'},
      orange:{primary:'#ea580c',secondary:'#fb923c',label:'برتقالي جذاب'},
      pink:{primary:'#db2777',secondary:'#f472b6',label:'وردي فخم'},
      teal:{primary:'#0d9488',secondary:'#2dd4bf',label:'تركواز بحري'},
      midnight:{primary:'#312e81',secondary:'#6d28d9',label:'منتصف الليل'},
      royalgold:{primary:'#b45309',secondary:'#f59e0b',label:'ذهبي ملكي'},
      crimson:{primary:'#b91c1c',secondary:'#ef4444',label:'قرمزي ناري'},
      sunset:{primary:'#ea580c',secondary:'#db2777',label:'غروب الشمس'},
      ocean:{primary:'#0369a1',secondary:'#06b6d4',label:'محيط عميق'},
      aurora:{primary:'#065f46',secondary:'#10b981',label:'شفق أخضر'},
      grape:{primary:'#6d28d9',secondary:'#c026d3',label:'عنبة'},
      sky:{primary:'#0284c7',secondary:'#38bdf8',label:'سماء صافية'},
      rosegold:{primary:'#be185d',secondary:'#fb7185',label:'وردي ذهبي'},
      emerald:{primary:'#047857',secondary:'#34d399',label:'زمردي'}
    };
    window.SKIN_THEMES = THEMES;
    window.SKIN_COLOR_PALETTE = COLORS;
  }
  readSkin();

  var themes = window.SKIN_THEMES;
  var palette = window.SKIN_COLOR_PALETTE;
  var current = 'default';

  function compute(sel) {
    var p, s;
    if (themes[sel]) { p = themes[sel].primary; s = themes[sel].secondary; }
    else {
      p = /^#[0-9a-f]{6}$/i.test(sel) ? sel : '#9c1e46';
      // مزج مع الأبيض كمحاكاة بسيطة (لوحة المعاينة فقط)
      var pr = parseInt(p.slice(1,3),16), pg=parseInt(p.slice(3,5),16), pb=parseInt(p.slice(5,7),16);
      s = '#' + [pr,pg,pb].map(function(x){return Math.round(x+(255-x)*.22).toString(16).padStart(2,'0');}).join('');
    }
    return {
      main: p, sec: s,
      bg: '#' + (function(){var pr=parseInt(p.slice(1,3),16),pg=parseInt(p.slice(3,5),16),pb=parseInt(p.slice(5,7),16);
        return [pr,pg,pb].map(function(x){return Math.round(x+(255-x)*.9).toString(16).padStart(2,'0');}).join('');})(),
      border: '#' + (function(){var pr=parseInt(p.slice(1,3),16),pg=parseInt(p.slice(3,5),16),pb=parseInt(p.slice(5,7),16);
        return [pr,pg,pb].map(function(x){return Math.round(x+(255-x)*.72).toString(16).padStart(2,'0');}).join('');})(),
      glow: 'rgba(' + parseInt(p.slice(1,3),16) + ',' + parseInt(p.slice(3,5),16) + ',' + parseInt(p.slice(5,7),16) + ',0.35)',
      btn: 'linear-gradient(135deg,' + p + ',' + s + ')'
    };
  }

  function renderThemes() {
    document.getElementById('THEMES').innerHTML =
      '<div class="sec-t">🎨 الثيمات الجميلة الجاهزة</div>' +
      '<div class="themes">' +
      Object.keys(themes).map(function(k){
        var t = themes[k], sel = current === k;
        return '<div class="thm' + (sel?' sel':'') + '" data-skin="' + k + '"><div class="sw" style="background:linear-gradient(135deg,' + t.primary + ',' + t.secondary + ')"></div><div class="lb">' + t.label + '</div></div>';
      }).join('') + '</div>';
    document.querySelectorAll('.thm').forEach(function(el){
      el.onmouseenter = function(){ renderLive(el.dataset.skin); };
      el.onclick = function(){ current = el.dataset.skin; renderAll(); };
    });
  }

  function renderColors() {
    var grid = document.getElementById('COLORS');
    grid.innerHTML =
      '<button class="dot auto' + (current==='default'?' sel':'') + '" data-c="">تلقائي</button>' +
      palette.map(function(c){
        return '<button class="dot' + (current===c?' sel':'') + '" data-c="' + c + '" style="background:' + c + '" title="' + c + '"></button>';
      }).join('');
    grid.querySelectorAll('.dot').forEach(function(el){
      el.onmouseenter = function(){ renderLive(el.dataset.c || 'default'); };
      el.onclick = function(){ current = el.dataset.c || 'default'; renderAll(); };
    });
  }

  function renderLive(sel) {
    var v = compute(sel);
    var box = document.getElementById('LIVE');
    box.style.background = v.bg;
    box.style.borderColor = v.border;
    box.innerHTML =
      '<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">' +
        '<span style="width:24px;height:24px;border-radius:50%;background:' + v.main + ';display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900;box-shadow:0 2px 8px ' + v.glow + '">ن</span>' +
        '<span style="font-weight:800;color:' + v.main + ';font-size:14px">نجوم العرب</span>' +
        '<span style="font-size:10px;color:#8a90a3">الآن</span>' +
      '</div>' +
      '<div style="max-width:82%;padding:9px 12px;border-radius:4px 12px 12px 12px;background:' + v.btn + ';color:#fff;font-size:13px;box-shadow:0 3px 10px ' + v.glow + '">هذه معاينة للون الجلد الجديد 🎨</div>' +
      '<div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
        '<span style="padding:7px 14px;border-radius:10px;background:' + v.btn + ';color:#fff;font-size:12px;font-weight:800;box-shadow:0 2px 8px ' + v.glow + '">زر أساسي</span>' +
        '<span style="padding:7px 14px;border-radius:10px;background:#fff;color:' + v.main + ';border:1.5px solid ' + v.border + ';font-size:12px;font-weight:800">زر ثانوي</span>' +
      '</div>' +
      '<div style="margin-top:10px"><span class="chip" style="background:' + v.main + ';color:#fff">' + v.main + '</span><span class="chip" style="background:#fff;color:' + v.main + ';border:1px solid ' + v.border + '">' + v.btn + '</span></div>';
  }

  function renderAll() { renderThemes(); renderColors(); renderLive(current); }
  renderAll();
})();
</script>
</body>
</html>
